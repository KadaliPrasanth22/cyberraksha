emergency.steps=If you think you have been scammed
emergency.step1=For suspected financial cyber fraud, contact 1930 promptly and follow the official instructions.
emergency.step2=Contact your bank or payment provider using a verified official channel.
emergency.step3=Keep evidence such as transaction references, messages, phone numbers, and screenshots.
emergency.step4=Secure affected accounts and never share OTPs, PINs, or passwords with callers.
emergency.disclaimer=Numbers and services can change. Verify details on official government sources. CyberRaksha does not itself submit a complaint.
