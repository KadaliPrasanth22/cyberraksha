emergency.title=அவசர உதவி மையம்
emergency.subtitle=இணைய மோசடி எனச் சந்தேகித்தால் உடனே அதிகாரப்பூர்வ வழிகளைப் பயன்படுத்துங்கள்.
emergency.call=அழைக்கவும்
emergency.open=அதிகாரப்பூர்வ வளத்தைத் திறக்கவும்
emergency.steps=மோசடிக்கு ஆளானதாக நினைத்தால்
emergency.step1=நிதி இணைய மோசடி எனச் சந்தேகித்தால் உடனே 1930-ஐ தொடர்புகொண்டு அதிகாரப்பூர்வ வழிமுறைகளைப் பின்பற்றுங்கள்.
emergency.step2=உறுதிப்படுத்தப்பட்ட அதிகாரப்பூர்வ வழியில் உங்கள் வங்கியைத் தொடர்புகொள்ளுங்கள்.
emergency.step3=பரிவர்த்தனை விவரங்கள், செய்திகள், தொலைபேசி எண்கள், திரைப்பிடிப்புகளைச் சேமியுங்கள்.
emergency.step4=கணக்குகளைப் பாதுகாக்கவும்; OTP, PIN அல்லது கடவுச்சொல்லைப் பகிர வேண்டாம்.
emergency.disclaimer=எண்கள் மாறக்கூடும். அதிகாரப்பூர்வ அரசு வளங்களில் சரிபார்க்கவும்.
games.title=இணையப் பாதுகாப்பு சவால்
games.subtitle=ஒவ்வொரு கற்பனைச் சூழலுக்கும் ஒரு பதிலைத் தேர்ந்தெடுக்கவும்.
