hero.title=நிறுத்துங்கள். சரிபாருங்கள். பாதுகாப்பாக இருங்கள்.
hero.subtitle=ஆன்லைன் மோசடிகளை அடையாளம் காணவும், பாதுகாப்பான முடிவுகளைப் பயிற்சி செய்யவும், அதிகாரப்பூர்வ உதவியைப் பெறவும் கற்றுக்கொள்ளுங்கள்.
