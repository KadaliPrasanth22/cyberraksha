footer.note=CyberRaksha ஒரு கல்வி வளம் மட்டுமே; இது அதிகாரப்பூர்வ அவசர சேவைகளுக்கு மாற்றாகாது.
learn.title=இணையப் பாதுகாப்பு நூலகம்
learn.subtitle=பொதுவான மோசடிகளையும் பாதுகாப்பு வழிகளையும் அறியுங்கள்.
