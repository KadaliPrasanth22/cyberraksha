<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Learn | CyberRaksha</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container page-main"><div class="page-heading"><p class="eyebrow">KNOWLEDGE IS YOUR FIRST SHIELD</p><h1 th:text="#{learn.title}">Cyber safety library</h1><p th:text="#{learn.subtitle}">Understand common scam patterns...</p></div><div class="lesson-grid"><article class="lesson-card" th:each="lesson,iter : ${lessons}"><div class="lesson-card-top"><span class="card-icon" th:text="${iter.index % 2 == 0 ? '🛡️' : '🔎'}">🛡️</span><span class="mini-pill">SAFETY GUIDE</span></div><h2 th:text="${lesson.title}">Title</h2><p th:text="${lesson.summary}">Summary</p><div class="warning-preview"><b>Remember</b><p th:text="${lesson.prevention}">Prevention tip</p></div><a class="btn btn-secondary full-width" th:href="@{/learn/{slug}(slug=${lesson.slug})}" th:text="#{button.read}">Read guide</a></article></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/app.js}"></script></body></html>
