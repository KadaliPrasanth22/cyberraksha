<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Games | CyberRaksha</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container page-main"><div class="page-heading"><p class="eyebrow">PRACTISE BEFORE IT HAPPENS</p><h1 th:text="#{games.title}">Cyber safety challenge</h1><p th:text="#{games.subtitle}">Choose one answer...</p></div><div class="score-banner" th:if="${submitted}"><span class="score-icon">🏆</span><div><h2><span th:text="#{games.score}">Your score</span>: <span th:text="${score}">0</span> / <span th:text="${total}">5</span></h2><p th:text="${score >= 4 ? 'Excellent awareness! Keep practising safe habits.' : (score >= 2 ? 'Good start. Review the explanations and try again.' : 'Keep learning. Review the guides and try again.')}">Result</p></div><a class="btn btn-secondary" th:href="@{/games}" th:text="#{games.retry}">Try again</a></div><form class="quiz-form" method="post" th:action="@{/games/submit}"><article class="question-card" th:each="question,q : ${questions}"><div class="question-number">QUESTION <span th:text="${q.count}">1</span> OF <span th:text="${#lists.size(questions)}">5</span></div><h2 th:text="${question.prompt}">Question?</h2><div class="option-list"><label class="quiz-option" th:each="option,opt : ${question.options}"><input type="radio" th:name="${'answers[' + q.index + ']'}" th:value="${opt.index}" required><span class="option-letter" th:text="${'ABC'.substring(opt.index,opt.index+1)}">A</span><span th:text="${option}">Option</span></label></div><div class="answer-explanation" th:if="${submitted}"><b>Correct answer:</b> <span th:text="${question.options[question.correctIndex]}">Answer</span><p th:text="${question.explanation}">Explanation</p></div></article><button class="btn btn-primary submit-quiz" type="submit" th:text="#{games.submit}">Check my answers</button></form><p class="small-note">These are educational simulations. No real bank, account, or personal information is requested.</p></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/app.js}"></script></body></html>
